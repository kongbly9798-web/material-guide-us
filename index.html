<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home Renovation Material Guide</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #faf6f2;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 16px;
      color: #4a3428;
      text-align: center;
    }

    .search-box {
      display: flex;
      width: 100%;
      max-width: 480px;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      background: #c2703d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .status {
      color: #666;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .error {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 8px;
      max-width: 480px;
      width: 100%;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #eee;
      display: block;
    }

    .card-body {
      padding: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
      font-size: 15px;
      color: #333;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #7c4a2d;
    }

    .photo-credit {
      font-size: 11px;
      color: #aaa;
      padding: 4px 20px 0;
    }

    .notice {
      font-size: 13px;
      color: #888;
      margin-top: 14px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    @media (max-width: 520px) {
      .search-box {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <h1>🏠 Home Renovation Material Guide</h1>

  <div class="search-box">
    <input
      type="text"
      id="materialInput"
      placeholder="e.g. vinyl plank flooring, drywall, quartz countertop"
    >
    <button id="searchBtn" onclick="searchMaterial()">
      Search
    </button>
  </div>

  <div id="statusMsg" class="status"></div>
  <div id="result"></div>

  <script>
    async function searchMaterial() {
      const input = document.getElementById("materialInput");
      const btn = document.getElementById("searchBtn");
      const statusDiv = document.getElementById("statusMsg");
      const resultDiv = document.getElementById("result");

      const query = input.value.trim();

      if (!query) {
        resultDiv.innerHTML =
          '<div class="error">Please enter a material name.</div>';
        return;
      }

      btn.disabled = true;
      statusDiv.textContent = "Searching...";
      resultDiv.innerHTML = "";

      try {
        // 1. Get material information
        const materialResponse = await fetch(
          "/.netlify/functions/search-material?q=" +
          encodeURIComponent(query)
        );

        if (!materialResponse.ok) {
          const errorText = await materialResponse.text();
          throw new Error(
            errorText || "Unable to retrieve material information."
          );
        }

        const textData = await materialResponse.json();

        // 2. Get related image
        let imageHtml = "";

        try {
          const imageResponse = await fetch(
            "/.netlify/functions/search-image?q=" +
            encodeURIComponent(query)
          );

          if (imageResponse.ok) {
            const imageData = await imageResponse.json();

            const imageUrl =
              imageData.image ||
              imageData.imageUrl ||
              imageData.url ||
              "";

            const photographer =
              imageData.photographer ||
              imageData.photographerName ||
              imageData.credit ||
              "";

            if (imageUrl) {
              imageHtml =
                '<img class="card-image" src="' +
                escapeHtml(imageUrl) +
                '" alt="' +
                escapeHtml(query) +
                '">' +
                (photographer
                  ? '<div class="photo-credit">Photo by ' +
                    escapeHtml(photographer) +
                    '</div>'
                  : "");
            }
          }
        } catch (imageError) {
          console.log("Image search failed:", imageError);
        }

        const materialText =
          textData.text ||
          textData.result ||
          textData.answer ||
          textData.content ||
          "No information was returned.";

        resultDiv.innerHTML =
          '<div class="card">' +
            imageHtml +
            '<div class="card-body">' +
              '<h2>' + escapeHtml(query) + '</h2>' +
              escapeHtml(materialText) +
              '<div class="notice">' +
                '⚠️ Prices, availability, building codes, installation requirements, ' +
                'and product specifications may vary by location. Always verify current ' +
                'information with the manufacturer, retailer, contractor, and local building authority.' +
              '</div>' +
            '</div>' +
          '</div>';

        statusDiv.textContent = "";

      } catch (err) {
        console.error(err);

        statusDiv.textContent = "";

        resultDiv.innerHTML =
          '<div class="error">❌ ' +
          escapeHtml(err.message || "An error occurred while searching.") +
          '</div>';

      } finally {
        btn.disabled = false;
      }
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value ?? "");
      return div.innerHTML;
    }

    document
      .getElementById("materialInput")
      .addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          searchMaterial();
        }
      });
  </script>

</body>
</html>ㄴㄴ
